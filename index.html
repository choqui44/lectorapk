<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Lector de cartillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#22262A; --muted:#5F6973; --line:#D3D9D6;
  --pencil:#F2BE2C; --pencil-ink:#2A2206; --graphite:#23272B;
  --ok:#1C8A4B; --ok-soft:#DDF1E5; --bad:#CC3A2A; --bad-soft:#F9E0DC; --warn:#B7791F; --blank:#98A1A9;
  --radius-s:6px; --radius-m:12px;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181B; --surface:#1E2226; --sunk:#191C1F; --ink:#E7EBED; --muted:#9AA4AD; --line:#343A40;
  --ok:#3DBB70; --ok-soft:#173526; --bad:#EE6A58; --bad-soft:#3A1E1A; --graphite:#0F1113;
}}
:root[data-theme="dark"]{ --bg:#15181B; --surface:#1E2226; --sunk:#191C1F; --ink:#E7EBED; --muted:#9AA4AD; --line:#343A40; --ok:#3DBB70; --ok-soft:#173526; --bad:#EE6A58; --bad-soft:#3A1E1A; --graphite:#0F1113;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h2{font-size:1.6rem} h3{font-size:1.25rem}
.muted{color:var(--muted)} .small{font-size:.875rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* barra superior */
.top{background:var(--graphite);color:#F3F5F4;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:4px solid var(--pencil)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.45rem;font-weight:700;white-space:nowrap}
.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--pencil);box-shadow:inset 0 0 0 4px var(--graphite),0 0 0 2px var(--pencil)}
.top .crumb{background:none;border:0;color:#C9D0D4;cursor:pointer;padding:6px 4px;font-size:.95rem}
.top .crumb:hover{color:#fff}
.top .title{font-family:var(--display);font-size:1.35rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sync{font-size:.8rem;color:#AEB7BD;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#BAC2C7;padding:10px 14px 12px;cursor:pointer;font-weight:700;white-space:nowrap;border-radius:8px 8px 0 0}
.tab[aria-selected="true"]{background:var(--pencil);color:var(--pencil-ink)}
.tab:not([aria-selected="true"]):hover{color:#fff}

main{padding:22px 0 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-bottom:18px}
.panel > h3{margin-bottom:4px}
.panel > .muted:first-of-type{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
input[type=text],input[type=number],select,textarea,input:not([type]){background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-s);padding:8px 10px;color:var(--ink);min-width:0;width:100%}
textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--pencil)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--graphite);color:#fff}
.note{border-left:4px solid var(--pencil);background:var(--sunk);padding:10px 14px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:12px 0}
.note.bad{border-color:var(--bad)}
.empty{text-align:center;padding:48px 16px}
.empty p{max-width:46ch;margin:10px auto 18px}

/* inicio */
.exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.exam-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.exam-card:hover{border-color:var(--muted)}
.exam-card h3{font-size:1.4rem}
.exam-card .stats{display:flex;gap:16px;font-size:.9rem;color:var(--muted)}
.exam-card .stats b{font-family:var(--display);font-size:1.3rem;color:var(--ink);display:block;line-height:1}

/* cursos */
.sec-table{width:100%;border-collapse:collapse;margin-top:10px}
.sec-table th{font-size:.8rem;font-weight:700;color:var(--muted);text-align:left;padding:4px 6px}
.sec-table td{padding:4px 6px;vertical-align:middle}
.sec-table input{padding:6px 8px}
.sec-table .num{width:78px}
.swatch{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:middle;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.scroll-x{overflow-x:auto}

/* clave */
.key-grid{columns:250px;column-gap:22px;margin-top:12px}
.key-sec{break-inside:avoid;margin:10px 0 4px;font-family:var(--display);font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.krow{display:flex;align-items:center;gap:4px;padding:2px 0;break-inside:avoid}
.kn{width:34px;text-align:right;font-family:var(--display);font-weight:700;font-size:1.05rem;padding-right:4px;border-right:3px solid var(--c,var(--line))}
.kb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--muted);padding:0}
.kb.on{background:var(--graphite);border-color:var(--graphite);color:#fff}
:root[data-theme="dark"] .kb.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kb.on{background:var(--pencil);color:var(--pencil-ink);border-color:var(--pencil)}}
.kbonus{width:28px;height:28px;border:0;background:none;cursor:pointer;color:var(--line);font-size:1.05rem;padding:0}
.kbonus.on{color:var(--warn)}
.kpts{width:56px!important;padding:4px 6px!important;font-size:.85rem;margin-left:2px}

/* hoja */
.sheet-frame{background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;display:flex;justify-content:center;overflow:auto}
.sheet-frame > svg{width:100%;max-width:620px;height:auto;background:#fff;box-shadow:0 1px 0 var(--line),0 10px 24px rgba(0,0,0,.08)}

/* escaneo */
.cam{position:relative;background:#101214;border-radius:var(--radius-m);overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
.cam video{width:100%;height:auto;display:block}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam .pill{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:700}
.cam .pill.ok{background:var(--ok)}
.cam-idle{color:#B9C1C6;text-align:center;padding:30px;max-width:40ch}
.scan-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){:root:not([data-view="pc"]) .scan-layout{grid-template-columns:1fr}}
.last{display:flex;gap:14px;align-items:center}
.last img{width:92px;border-radius:6px;border:1px solid var(--line)}
.big-note{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:.9}
.big-note small{font-size:1.2rem;color:var(--muted);font-weight:600}
.log{list-style:none;padding:0;margin:10px 0 0;font-size:.9rem;max-height:240px;overflow:auto}
.log li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log .e{color:var(--bad)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--pencil)}

/* resultados */
table.res{width:100%;border-collapse:collapse;font-size:.92rem}
table.res th{position:sticky;top:0;background:var(--surface);font-size:.8rem;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);cursor:pointer;white-space:nowrap}
table.res th[data-sorted]{color:var(--ink)}
table.res td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.res tbody tr{cursor:pointer}
table.res tbody tr:hover{background:var(--sunk)}
.note-cell{font-family:var(--display);font-weight:700;font-size:1.2rem}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.eff-cell{display:inline-block;min-width:44px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:700;font-size:.85rem}

/* análisis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:2.1rem;line-height:1;font-weight:700}
.kpi span{font-size:.85rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;gap:10px;align-items:center}
.bar-row .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:18px;background:var(--sunk);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.track i{display:block;height:100%;border-radius:999px;transition:width .5s ease}
.bar-row .val{font-family:var(--display);font-weight:700;font-size:1.15rem;text-align:right}
.bar-row .sub{grid-column:2/4;font-size:.8rem;color:var(--muted);margin-top:-8px}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:14px}
.hq{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;font-family:var(--display);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:1.05rem;position:relative}
.hq small{font-size:.68rem;font-family:var(--body);opacity:.9;margin-top:2px}
.hq[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--ink)}
.hq.nokey{background:var(--sunk)!important;color:var(--muted);border:1.5px dashed var(--line)}
.legend{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend .grad{width:140px;height:10px;border-radius:999px;background:linear-gradient(90deg,hsl(0 62% 46%),hsl(40 75% 45%),hsl(130 50% 36%))}
.dist{display:grid;grid-template-columns:96px 1fr 76px;gap:8px;align-items:center;font-size:.9rem;margin-top:6px}

/* modal detalle */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,14,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 12px max(16px,env(safe-area-inset-bottom,0px))}
.modal-card{background:var(--surface);border-radius:var(--radius-m);width:100%;max-width:980px;padding:18px;position:relative}
.modal-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.modal-head .grow{flex:1;min-width:180px;display:grid;grid-template-columns:1fr 130px;gap:8px}
.det{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){:root:not([data-view="pc"]) .det{grid-template-columns:1fr}}
.rev{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rev img{display:block;width:100%;height:auto}
.rev svg{position:absolute;inset:0;width:100%;height:100%}
.qlist{border-collapse:collapse;width:100%;font-size:.9rem}
.qlist td{padding:5px 6px;border-bottom:1px solid var(--line)}
.qlist .mb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:none;font-size:.7rem;font-weight:700;cursor:pointer;padding:0;color:var(--muted)}
.qlist .mb.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.qlist .mb.key{box-shadow:0 0 0 2px var(--ok)}
.st{font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.ok,.st.bonus{background:var(--ok-soft);color:var(--ok)} .st.bad,.st.multi{background:var(--bad-soft);color:var(--bad)} .st.blank{background:var(--sunk);color:var(--muted)} .st.nokey{color:var(--muted)} .st.warn{background:#FCEFC7;color:#8A5A00} .qlist tr.doubt td{background:color-mix(in srgb,var(--pencil) 16%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);color:#fff;padding:10px 18px;border-radius:999px;z-index:80;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.hidden{display:none!important}
#printArea{display:none}
.cam.has-result{display:block;background:var(--surface);border:1px solid var(--line)}
.cam.has-result video,.cam.has-result canvas,.cam.has-result .pill{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cam-result{padding:12px}
.cr-head{display:flex;align-items:center;justify-content:center;gap:10px}
.cr-score{font-family:var(--display);font-weight:700;font-size:1.9rem;text-align:center;line-height:1.1}
.cr-score small{display:block;font-size:1.15rem}
.cam{scroll-margin-top:calc(110px + env(safe-area-inset-top,0px))}
.cr-name{text-align:center;color:var(--muted);margin:2px 0 8px}
.cr-warn{text-align:center;font-weight:700;color:#8A5A00;background:#FCEFC7;border-radius:8px;padding:6px;margin-bottom:8px}
.cam-result .rev{max-width:520px;margin:0 auto}
.cam .pill{max-width:calc(100% - 24px)}
/* botones de vista y tema */
.tools{display:flex;gap:6px;align-items:center}
.icon-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#EEF1F2;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.85rem;white-space:nowrap}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn svg{width:18px;height:18px;flex:none}
.tab svg{display:none}
.rcards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rcard{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px;cursor:pointer;text-align:left;width:100%}
.rcard .nm{font-weight:700;line-height:1.25}
.rcard .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rcard .chip{font-size:.72rem;font-weight:700;color:#fff;border-radius:999px;padding:1px 7px}

/* ===== Formato PC ===== */
:root[data-view="pc"] body{min-width:1024px}
:root[data-view="pc"] .wrap{max-width:1280px}

/* ===== Formato celular ===== */
:root[data-view="movil"] .wrap{max-width:540px;padding:0 12px}
:root[data-view="movil"] .panel{padding:14px}
:root[data-view="movil"] .scan-layout,:root[data-view="movil"] .det,:root[data-view="movil"] .two{grid-template-columns:1fr}
:root[data-view="movil"] .grid-fields{grid-template-columns:1fr 1fr}
:root[data-view="movil"] .kpis{grid-template-columns:repeat(2,1fr)}
:root[data-view="movil"] .kpi b{font-size:1.7rem}
:root[data-view="movil"] .kpi:last-child:nth-child(odd){grid-column:1/-1}
:root[data-view="movil"] .exam-list{grid-template-columns:1fr}
:root[data-view="movil"] .sync,:root[data-view="movil"] .icon-btn span{display:none}
:root[data-view="movil"] .icon-btn{padding:8px}
:root[data-view="movil"] .brand{font-size:1.2rem}
:root[data-view="movil"] .key-grid{columns:1}
:root[data-view="movil"] .big-note{font-size:2.6rem}
:root[data-view="movil"] .bar-row{grid-template-columns:90px 1fr 50px}
:root[data-view="movil"] .modal{padding-left:6px;padding-right:6px}
:root[data-view="movil"] .modal-card{padding:12px}
:root[data-view="movil"] .modal-head .grow{grid-template-columns:1fr}
:root[data-view="movil"] .heat{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
:root[data-view="movil"] .tabs-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--graphite);border-top:3px solid var(--pencil);padding:0 0 env(safe-area-inset-bottom,0px);max-width:none}
:root[data-view="movil"] .tabs{justify-content:space-around;gap:0}
:root[data-view="movil"] .tab{flex:1;border-radius:0;padding:7px 2px 9px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px}
:root[data-view="movil"] .tab svg{display:block;width:22px;height:22px}
:root[data-view="movil"] main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
:root[data-view="movil"] .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
:root[data-view="movil"] .sheet-frame{padding:8px}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea > svg{width:210mm;height:297mm;display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){ :root:not([data-view="pc"]) .sync{display:none} :root:not([data-view="pc"]) .wrap{padding:0 12px} :root:not([data-view="pc"]) .panel{padding:14px} :root:not([data-view="pc"]) .big-note{font-size:2.6rem} :root:not([data-view="pc"]) .bar-row{grid-template-columns:90px 1fr 50px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
/* ===== Núcleo OMR: formato tipo ZipGrade (bloques de 10 con ■) + lectura ===== */
const OMR = (() => {
  const W = 1000, H = 1414, OPTS = ['A', 'B', 'C', 'D', 'E'];
  const ID_ORDER = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0], OMR_ID_ORDER = ID_ORDER;
  const FORMATS = [{ cols: 3, slots: 2, p: 39, r: 13 }, { cols: 4, slots: 3, p: 30, r: 10.5 }];

  // La altura de la cartilla se ajusta a su contenido (para imprimir varias por hoja)
  function buildLayout(nQ, idDigits) {
    const nBlocks = Math.ceil(nQ / 10);
    let F = null, idSlots = 0, S = 1;
    for (const f of FORMATS) {
      const colW = 860 / f.cols, idW = f.p * 0.9 + idDigits * f.p;
      const s = idDigits > 0 ? Math.ceil(idW / colW) : 0;
      if (s > f.cols) continue;
      let slots = 1; while (f.cols * slots - s < nBlocks) slots++;
      if (slots <= f.slots) { F = f; idSlots = s; S = slots; break; }
    }

}


const Cam = {
  stream: null, timer: null, prev: null, stable: 0, waitLost: false, busy: false, auto: true, work: document.createElement('canvas'),
  async start() {
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (e) {
      toast('No se pudo abrir la cámara aquí. Usa "Tomar foto" o "Subir imágenes".'); return;
    }
    render();
    const v = $('#vid'); if (!v) return;
    v.srcObject = this.stream; await v.play().catch(() => { });
    this.loop();
  },
  stop() { clearTimeout(this.timer); if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; },
  loop() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.tick(); if (this.stream) this.loop(); }, 320);
  },
  tick() {
    const v = $('#vid'), ov = $('#ov'), ex = curExam();
    if (!v || !ov || !ex || v.readyState < 2 || this.busy) return;
    if (S.camResult) { const o = ov.getContext('2d'); o.clearRect(0, 0, ov.width, ov.height); return; }
    const vw = v.videoWidth, vh = v.videoHeight, s = 1100 / Math.max(vw, vh);
    const w = Math.round(vw * s), h = Math.round(vh * s), c = this.work; c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(v, 0, 0, w, h);
    const g = OMR.grayFromRGBA(ctx.getImageData(0, 0, w, h).data, w, h);
    const L = layoutOf(ex), loc = OMR.locateAll(g, w, h, L, ex.sens);
    ov.width = w; ov.height = h;
    const o = ov.getContext('2d'); o.clearRect(0, 0, w, h);
    const pill = $('#pill');
    if (!loc.ok) { this.stable = 0; this.prev = null; this.lastSig = null; this.waitLost = false; if (pill) { pill.textContent = loc.err; pill.className = 'pill'; } return; }
    // Lee cada pregunta en vivo y la dibuja sobre la imagen (como ZipGrade)
    const reads = loc.sheets.map(sh => {
      const r = OMR.readMarks({ b: loc.b, map: sh.map }, w, h, L, ex.thr, ex.autoThr !== false);
      drawLive(o, sh, r, grade(ex, r.answers), L, ex);
      return r;
    });
    const sig = reads.map(r => r.answers.join('|') + '#' + r.id).join('/');
    this.sameRead = sig === this.lastSig ? (this.sameRead || 0) + 1 : 0;
    this.lastSig = sig;
    const P = loc.sheets.flatMap(sh => sh.corners);
    const same = this.prev && this.prev.length === P.length;
    const move = same ? P.reduce((a, p, i) => a + Math.hypot(p.x - this.prev[i].x, p.y - this.prev[i].y), 0) / P.length / w : 1;
    this.prev = P.map(p => ({ x: p.x, y: p.y }));
    this.stable = move < 0.03 ? this.stable + 1 : 0;
    const n = loc.sheets.length;
    const g0 = grade(ex, reads[0].answers);
    const txt = n > 1 ? `${n} cartillas: leyendo…` : (ex.key.some(Boolean) ? `${g0.T.c} / ${g0.T.n} correctas` : `${reads[0].answers.filter(Boolean).length} marcadas (sin clave)`);
    if (pill) { pill.textContent = this.auto ? txt + ' · no muevas la hoja' : txt + ' · toca Capturar'; pill.className = 'pill ok'; }
    // captura automática: la misma lectura 2 veces seguidas con la hoja quieta
    if (this.auto && this.sameRead >= 1 && this.stable >= 1) this.capture();
  },
  grab(max) {
    const v = $('#vid'), vw = v.videoWidth, vh = v.videoHeight, s = Math.min(1, max / Math.max(vw, vh));
    const c = document.createElement('canvas'); c.width = Math.round(vw * s); c.height = Math.round(vh * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    return c;
  },
  async capture() {
    const v = $('#vid'), ex = curExam(); if (!v || !ex || v.readyState < 2 || this.busy) return;
    this.busy = true;
    // Lee 3 cuadros seguidos y vota cartilla por cartilla: solo se acepta lo que coincide
    const frames = [];
    for (let i = 0; i < 3; i++) {
      const R = readCanvas(this.grab(2200), ex);
      if (R.ok) frames.push(R.sheets);
      await new Promise(res => setTimeout(res, 140));
    }
    this.busy = false;
    if (!frames.length) { toast('La hoja se movió al leer. Mantén quieta la cámara.'); handleRead({ ok: false, err: 'La hoja se movió al leer. Mantén quieta la cámara.' }, ex, 'cámara'); return; }
    const base = frames.reduce((a, f) => f.length > a.length ? f : a, frames[0]);
    const vote = arr => { const c = {}; arr.forEach(a => c[a] = (c[a] || 0) + 1); return Object.entries(c).sort((a, b) => b[1] - a[1])[0]; };
    const sheets = base.map(sh => {
      // la misma cartilla en cada cuadro = la de centro más cercano
      const reads = frames.map(f => f.reduce((best, x) => !best || Math.hypot(x.center.x - sh.center.x, x.center.y - sh.center.y) < Math.hypot(best.center.x - sh.center.x, best.center.y - sh.center.y) ? x : best, null))
        .filter(x => x && Math.hypot(x.center.x - sh.center.x, x.center.y - sh.center.y) < 60);
      const doubts = new Set();
      const answers = sh.answers.map((_, i) => {
        const [a, n] = vote(reads.map(r => r.answers[i]));
        if (n < reads.length || reads.length < 2 || reads.some(r => r.doubts.includes(i))) doubts.add(i);
        return a;
      });
      const [id, nid] = vote(reads.map(r => r.id));
      return { ok: true, answers, id, doubts: [...doubts].sort((a, b) => a - b), idDoubt: nid < reads.length || reads.some(x => x.idDoubt), img: sh.img };
    });
    this.stable = 0; this.sameRead = 0; this.lastSig = null; if (navigator.vibrate) navigator.vibrate(60);
    handleReadAll({ ok: true, sheets }, ex, 'cámara');
  }
};

/* ===== Página A4 con varias cartillas ===== */
function pageGrid(ex, n) {
  const L = layoutOf(ex), PW = 200, PH = 287, G = 6;
  let best = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const tw = (PW - (c - 1) * G) / c, th = (PH - (r - 1) * G) / r;
    const scale = Math.min(tw / L.W, th / L.H);
    if (!best || scale > best.scale) best = { c, r, scale };
  }
  const tw = L.W * best.scale, th = L.H * best.scale;
  const gw = best.c * tw + (best.c - 1) * G, gh = best.r * th + (best.r - 1) * G;
  best.x0 = 5 + (PW - gw) / 2; best.y0 = 5 + (PH - gh) / 2; best.tw = tw; best.th = th; best.G = G;
  best.bubbleMM = 2 * L.r * best.scale; // diámetro impreso del círculo en mm
  return best;
}
function pageSVG(ex, n, fills) {
  const P = pageGrid(ex, n), inner = [];
  for (let i = 0; i < n; i++) {
    const c = i % P.c, r = Math.floor(i / P.c);
    const x = P.x0 + c * (P.tw + P.G), y = P.y0 + r * (P.th + P.G);
    const L = layoutOf(ex);
    const svg = sheetSVG(ex, fills && fills[i]).replace(` width="${L.W}" height="${L.H}"`, '').replace('<svg ', `<svg x="${x}" y="${y}" width="${P.tw}" height="${P.th}" `);
    inner.push(svg);
  }
  const cuts = [];
  for (let c = 1; c < P.c; c++) { const x = P.x0 + c * (P.tw + P.G) - P.G / 2; cuts.push(`<line x1="${x}" y1="2" x2="${x}" y2="295" stroke="#bbb" stroke-width="0.25" stroke-dasharray="2 2"/>`); }
  for (let r = 1; r < P.r; r++) { const y = P.y0 + r * (P.th + P.G) - P.G / 2; cuts.push(`<line x1="2" y1="${y}" x2="208" y2="${y}" stroke="#bbb" stroke-width="0.25" stroke-dasharray="2 2"/>`); }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="1600" height="2262"><rect width="210" height="297" fill="#fff"/>${cuts.join('')}${inner.join('')}</svg>`;
}

function sectionWarnings(ex) {
  const w = [], cover = Array(ex.nQ).fill(0);
  ex.sections.forEach(s => {
    if (!(+s.from >= 1 && +s.to >= +s.from)) w.push(`El rango de "${s.name}" no es válido.`);
    if (+s.to > ex.nQ) w.push(`"${s.name}" llega a la pregunta ${s.to}, pero la hoja tiene ${ex.nQ}.`);
    for (let i = +s.from; i <= Math.min(+s.to, ex.nQ); i++) cover[i - 1]++;
  });
  const dup = cover.map((c, i) => c > 1 ? i + 1 : 0).filter(Boolean);
  if (dup.length) w.push(`Preguntas en más de un curso: ${dup.slice(0, 12).join(', ')}${dup.length > 12 ? '…' : ''}. Cuenta el primer curso de la lista.`);
  const none = cover.map((c, i) => c === 0 ? i + 1 : 0).filter(Boolean);
  if (ex.sections.length && none.length) w.push(`${none.length} pregunta(s) sin curso (${none.slice(0, 8).join(', ')}${none.length > 8 ? '…' : ''}); se agrupan en "Sin curso" con 1 punto.`);

    <div class="scroll-x"><table class="sec-table"><thead><tr><th></th><th>Curso</th><th>Desde</th><th>Hasta</th><th>Correcta</th><th>Incorrecta</th><th>En blanco</th><th></th></tr></thead><tbody>${secRows}</tbody></table></div>
    ${warn.map(t => `<div class="note small">${esc(t)}</div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="addsec">Agregar curso</button>
      <span class="row small muted">Repartir en <input type="number" min="1" max="20" value="${Math.max(2, ex.sections.length || 5)}" id="splitN" style="width:64px"> cursos iguales <button class="btn sm" data-act="split">Repartir</button></span></div>
  </div>

  <div class="panel"><h3>Clave de respuestas</h3>
    <p class="muted small">Toca la alternativa correcta. La estrella anula la pregunta (todos reciben su puntaje). El casillero de la derecha cambia el puntaje solo de esa pregunta. También puedes escanear una hoja marcada con la clave desde Escanear.</p>
    <div class="row"><input type="text" id="pasteKey" placeholder="Pega la clave: ABCDE BADCE…  (usa - para vacía y * para anulada)" style="flex:1;min-width:220px"><button class="btn sm" data-act="paste">Aplicar</button><button class="btn sm ghost" data-act="clearkey">Borrar clave</button></div>
    <div class="key-grid">${keyHtml}</div>
  </div>

  <div class="panel"><h3>Alumnos</h3>
    <p class="muted small">Una línea por alumno: código, nombre. Al escanear, el nombre se completa solo según el código marcado.</p>
    <textarea id="roster" data-ex="roster" placeholder="100001, Ana Quispe">${esc(ex.roster)}</textarea>
  </div>

  <div class="panel"><h3>Lectura</h3>
    <div class="grid-fields">
      <label class="switch" style="grid-column:1/-1"><input type="checkbox" id="autoThr" ${ex.autoThr !== false ? 'checked' : ''}>Umbral automático: la app compara todos los círculos de cada hoja y separa marcados de vacíos (recomendado)</label>
      <label class="f">Relleno mínimo (si el automático está apagado): <b id="thrV">${Math.round(ex.thr * 100)}%</b><input type="range" min="0.2" max="0.7" step="0.01" value="${ex.thr}" data-ex="thr" id="exThr"></label>
      <label class="f">Contraste para detectar lápiz: <b id="sensV">${Math.round(ex.sens * 100)}</b><input type="range" min="0.06" max="0.3" step="0.01" value="${ex.sens}" data-ex="sens" id="exSens"></label>
    </div>
    <p class="muted small">Baja el relleno mínimo si el lápiz es tenue; súbelo si los borrones cuentan como marca.</p>
  </div>
  <div class="row"><button class="btn danger" data-act="delexam">Eliminar evaluación</button></div>`;
}

function sheetView(ex) {
  const n = ex.perPage || 1, P = pageGrid(ex, n), L = layoutOf(ex);
  const small = P.bubbleMM < 2.6;
  return `<div class="panel"><div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><h3>Hoja de respuestas</h3><p class="muted small" style="margin:4px 0 0">${ex.nQ} preguntas, código de ${ex.idDigits} dígitos. La cartilla mide lo que su contenido necesita, así caben varias por hoja A4.</p></div>
      <label class="f" style="min-width:170px">Cartillas por hoja A4<select id="perPage">${[1, 2, 3, 4, 6, 8, 9].map(k => `<option value="${k}" ${k === n ? 'selected' : ''}>${k}</option>`).join('')}</select></label></div>
    <p class="small" style="margin:10px 0 0">Distribución ${P.c} × ${P.r} · cada cartilla de ${Math.round(P.tw)} × ${Math.round(P.th)} mm · círculos de <b>${P.bubbleMM.toFixed(1)} mm</b></p>
    ${small ? `<div class="note bad small">Los círculos quedan muy pequeños para rellenar con lápiz (menos de 2.6 mm). Usa menos cartillas por hoja o menos preguntas.</div>` : ''}
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="print">Imprimir</button><button class="btn" data-act="png">Descargar PNG</button><button class="btn" data-act="htmlsheet">Descargar para imprimir</button></div>
    <p class="muted small" style="margin-bottom:0">Imprime a escala 100%. Puedes recortar por la línea punteada o escanear la hoja entera: el lector encuentra todas las cartillas de la foto y las califica por separado.</p></div>
    <div class="sheet-frame">${pageSVG(ex, n).replace('width="1600" height="2262"', '')}</div>`;
}

function scanView(ex) {
  const keyN = ex.key.filter(Boolean).length;
  const last = S.last && S.results[S.last];
  let lastHtml = '';
  if (last && last.examId === ex.id) {
    const g = grade(ex, last.answers);
    lastHtml = `<div class="panel"><h3>Última hoja</h3><div class="last" style="margin-top:10px">
      <img src="${last.img || ''}" alt="Hoja escaneada">
      <div style="flex:1"><div class="big-note ${passes(ex, g.T.note) ? 'pass' : 'fail'}">${fmt(g.T.note)}<small> ${scaleLabel(ex)}</small></div>
      <div class="small">${esc(last.name || 'Sin nombre')} · código ${esc(last.studentId || '—')}</div>
      <div class="small muted">${g.T.c} correctas, ${g.T.w} incorrectas, ${g.T.b} en blanco</div>
      ${(last.doubts || []).length || last.idDoubt ? `<div class="small" style="color:var(--warn);font-weight:700">Revisar: ${[...(last.doubts || []).map(i => 'P' + (i + 1)), ...(last.idDoubt ? ['código'] : [])].join(', ')}</div>` : `<div class="small pass" style="font-weight:700">Lectura segura</div>`}</div>
      <button class="btn sm" data-act="detail" data-id="${last.id}">Revisar</button></div></div>`;
  }
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div class="seg" role="group" aria-label="Qué vas a escanear">
        <button data-act="mode" data-m="alumnos" aria-pressed="${S.scanMode === 'alumnos'}">Alumnos</button>
        <button data-act="mode" data-m="clave" aria-pressed="${S.scanMode === 'clave'}">Clave</button></div>
      <label class="switch"><input type="checkbox" id="autoCap" ${Cam.auto ? 'checked' : ''}>Captura automática</label>
    </div>
    ${S.scanMode === 'alumnos' && !keyN ? `<div class="note bad">Esta evaluación aún no tiene clave. Puedes escanear igual, pero las notas saldrán en cero hasta que la completes.</div>` : ''}
    ${S.scanMode === 'clave' ? `<div class="note">Marca la clave en una hoja impresa de esta evaluación y escanéala: las respuestas pasarán a la clave.</div>` : ''}
    <div class="scan-layout">
      <div>
        <div class="cam ${S.camResult ? 'has-result' : ''}" id="camBox">${Cam.stream ? `<video id="vid" playsinline muted autoplay></video><canvas id="ov"></canvas><span class="pill" id="pill">Buscando los 4 cuadros negros…</span>`
          : (S.camResult ? '' : `<div class="cam-idle"><p>Encuadra la hoja completa con sus 4 cuadros negros. Verás en vivo cada pregunta: verde si es correcta, rojo si es incorrecta. La lectura se guarda sola cuando la imagen está quieta.</p><button class="btn primary" data-act="camon">Activar cámara</button></div>`)}
          ${S.camResult ? camResultView(ex) : ''}</div>
        <div class="row" style="margin-top:12px">
          ${Cam.stream ? `<button class="btn primary" data-act="capture">Capturar ahora</button><button class="btn" data-act="camoff">Detener cámara</button>` : ''}
          <label class="btn">Tomar foto<input type="file" accept="image/*" capture="environment" id="camFile" class="hidden"></label>
          <label class="btn">Subir imágenes<input type="file" accept="image/*" multiple id="galFile" class="hidden"></label>
          <button class="btn ghost" data-act="sim">Probar con una hoja simulada${(ex.perPage || 1) > 1 ? ` (${ex.perPage} cartillas)` : ''}</button>
        </div>
      </div>
      <div>${lastHtml}
        <div class="panel"><h3>Registro</h3>${S.log.length ? `<ul class="log">${S.log.slice(0, 40).map(l => `<li><span>${esc(l.m || l.e)}</span><span class="${l.e ? 'e' : 'muted'} small">${esc(l.t)}</span></li>`).join('')}</ul>` : `<p class="muted small">Aquí aparece cada hoja leída. Consejos: buena luz, sin sombras sobre la hoja y el papel plano.</p>`}</div>
      </div>
    </div>`;
}

// Resultado recién leído, como la pantalla de revisión de ZipGrade
function camResultView(ex) {
  const ids = S.camResult.filter(id => S.results[id]); if (!ids.length) return '';
  const i = Math.min(S.camIdx || 0, ids.length - 1), r = S.results[ids[i]], g = grade(ex, r.answers);
  const hasKey = g.T.n > 0;
  const nd = (r.doubts || []).length + (r.idDoubt ? 1 : 0);
  return `<div class="cam-result">
    <div class="cr-head">
      ${ids.length > 1 ? `<button class="btn sm" data-act="cridx" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Anterior">‹</button>` : ''}
      <div class="cr-score">${hasKey ? `${g.T.c} / ${g.T.n} = ${pct(g.T.eff)}` : 'Sin clave'}<small class="${passes(ex, g.T.note) ? 'pass' : 'fail'}">Nota ${fmt(g.T.note)} ${scaleLabel(ex)}</small></div>
      ${ids.length > 1 ? `<button class="btn sm" data-act="cridx" data-d="1" ${i === ids.length - 1 ? 'disabled' : ''} aria-label="Siguiente">›</button>` : ''}
    </div>
    <div class="cr-name">${esc(r.name || 'Sin nombre')} · código ${esc(r.studentId || '—')}${ids.length > 1 ? ` · cartilla ${i + 1} de ${ids.length}` : ''}</div>
    ${nd ? `<div class="cr-warn">Revisa ${[...(r.doubts || []).map(q => 'P' + (q + 1)), ...(r.idDoubt ? ['el código'] : [])].join(', ')}</div>` : ''}
    <div class="rev">${r.img ? `<img src="${r.img}" alt="Hoja corregida">${overlaySVG(ex, g, r)}` : ''}</div>
    <div class="row" style="margin-top:10px;justify-content:center">
      <button class="btn primary" data-act="crnext">Escanear siguiente</button>
      <button class="btn" data-act="detail" data-id="${r.id}">Ver preguntas / corregir</button>
    </div></div>`;
}

function rowsFor(ex) {
  return examResults(ex).map(r => ({ r, g: grade(ex, r.answers) }));
}
function resultsView(ex) {
  const rows = rowsFor(ex);
  if (!rows.length) return `<div class="panel empty"><h2>Todavía no hay hojas</h2><p class="muted">Escanea las hojas de tus alumnos y aquí verás el orden de mérito, con la nota por curso.</p><button class="btn primary" data-act="tab" data-tab="scan">Ir a escanear</button></div>`;
  const secs = rows[0].g.secs;
  const q = S.q.toLowerCase();
  let list = rows.filter(x => !q || (x.r.name || '').toLowerCase().includes(q) || (x.r.studentId || '').includes(q));
  const k = S.sort.k, d = S.sort.d;
  const val = x => k === 'nota' ? x.g.T.note : k === 'eff' ? x.g.T.eff : k === 'name' ? (x.r.name || '~').toLowerCase() : k === 'id' ? x.r.studentId || '' : k.startsWith('s:') ? (x.g.secs.find(s => s.sec.id === k.slice(2)) || { note: 0 }).note : x.g.T.note;
  list.sort((a, b) => { const A = val(a), B = val(b); return (A > B ? 1 : A < B ? -1 : 0) * d; });
  const th = (key, label) => `<th data-act="sort" data-k="${key}" ${S.sort.k === key ? 'data-sorted' : ''}>${label}${S.sort.k === key ? (S.sort.d > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const effStyle = e => `background:${heat(e)};color:#fff`;
  const tools = `<div class="row" style="justify-content:space-between">
      <input type="text" id="search" placeholder="Buscar por nombre o código" value="${esc(S.q)}" style="max-width:300px">
      <div class="row"><button class="btn sm" data-act="csv">Descargar CSV</button><button class="btn sm" data-act="copy">Copiar para Excel</button></div></div>`;
  if (S.view === 'movil') {
    return `<div class="panel">${tools}
      <div class="row small" style="margin-top:10px">Ordenar: <select id="sortSel" style="width:auto">${[['nota', 'Nota'], ['eff', 'Eficiencia'], ['name', 'Nombre'], ['id', 'Código'], ...secs.map(s => ['s:' + s.sec.id, s.sec.name])].map(([k, l]) => `<option value="${k}" ${S.sort.k === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="rcards">${list.map((x, i) => `<button class="rcard" data-act="detail" data-id="${x.r.id}">
        <span class="muted" style="font-family:var(--display);font-size:1.3rem;font-weight:700">${i + 1}</span>
        <span><span class="nm">${esc(x.r.name || 'Sin nombre')}</span>${(x.r.doubts || []).length || x.r.idDoubt ? ' <span class="st warn">revisar</span>' : ''}<br><span class="small muted">Código ${esc(x.r.studentId || '—')} · ${x.g.T.c}/${x.g.T.w}/${x.g.T.b} · ${pct(x.g.T.eff)}</span>
          <span class="chips">${x.g.secs.map(s => `<span class="chip" style="background:${heat(s.eff)}" title="${esc(s.sec.name)}">${esc(s.sec.name.slice(0, 10))} ${fmt(s.note)}</span>`).join('')}</span></span>
        <span class="note-cell ${passes(ex, x.g.T.note) ? 'pass' : 'fail'}" style="font-size:1.8rem">${fmt(x.g.T.note)}</span></button>`).join('')}</div></div>`;
  }
  return `<div class="panel"><div class="row" style="justify-content:space-between">
      <input type="text" id="search" placeholder="Buscar por nombre o código" value="${esc(S.q)}" style="max-width:300px">
      <div class="row"><button class="btn sm" data-act="csv">Descargar CSV</button><button class="btn sm" data-act="copy">Copiar para Excel</button></div></div>
    <div class="scroll-x" style="margin-top:12px"><table class="res"><thead><tr><th>#</th>${th('id', 'Código')}${th('name', 'Alumno')}${th('nota', 'Nota')}<th>Puntaje</th>${th('eff', 'Eficiencia')}<th>C / I / B</th>
      ${secs.map(s => th('s:' + s.sec.id, `<span class="swatch" style="background:${s.sec.color};width:10px;height:10px"></span> ${esc(s.sec.name)}`)).join('')}</tr></thead>
    <tbody>${list.map((x, i) => `<tr data-act="detail" data-id="${x.r.id}"><td class="muted">${i + 1}</td><td>${esc(x.r.studentId || '—')}</td><td>${esc(x.r.name || 'Sin nombre')}${(x.r.doubts || []).length || x.r.idDoubt ? ` <span class="st warn" title="Tiene lecturas por revisar">revisar</span>` : ''}</td>
      <td class="note-cell ${passes(ex, x.g.T.note) ? 'pass' : 'fail'}">${fmt(x.g.T.note)}</td><td>${fmt(x.g.T.score)} / ${fmt(x.g.T.max)}</td>
      <td><span class="eff-cell" style="${effStyle(x.g.T.eff)}">${pct(x.g.T.eff)}</span></td><td class="muted">${x.g.T.c} / ${x.g.T.w} / ${x.g.T.b}</td>
      ${x.g.secs.map(s => `<td title="${s.c} de ${s.n} correctas">${fmt(s.note)} <span class="eff-cell" style="${effStyle(s.eff)}">${pct(s.eff)}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted small">Nota por curso en la misma escala (${ex.scale > 0 ? 'sobre ' + ex.scale : 'puntaje'}) y su eficiencia (preguntas correctas del curso). Toca una fila para ver la hoja.</p></div>`;
}

function statsView(ex) {
  const rows = rowsFor(ex);
  if (!rows.length) return `<div class="panel empty"><h2>Sin datos todavía</h2><p class="muted">El análisis aparece cuando escaneas al menos una hoja.</p><button class="btn primary" data-act="tab" data-tab="scan">Ir a escanear</button></div>`;
  const n = rows.length, notes = rows.map(x => x.g.T.note);
  const avg = notes.reduce((a, b) => a + b, 0) / n;
  const effT = rows.reduce((a, x) => a + x.g.T.c, 0) / Math.max(1, rows.reduce((a, x) => a + x.g.T.n, 0));
  const nPass = rows.filter(x => passes(ex, x.g.T.note)).length;
  const sd = Math.sqrt(notes.reduce((a, v) => a + (v - avg) ** 2, 0) / n);
  // por curso
  const secs = rows[0].g.secs.map((s, j) => {
    const c = rows.reduce((a, x) => a + x.g.secs[j].c, 0), tot = rows.reduce((a, x) => a + x.g.secs[j].n, 0);
    return { s: s.sec, eff: tot ? c / tot : 0, note: rows.reduce((a, x) => a + x.g.secs[j].note, 0) / n, score: rows.reduce((a, x) => a + x.g.secs[j].score, 0) / n, max: s.max, n: s.n };
  });
  // histograma
  const top = ex.scale > 0 ? ex.scale : Math.max(1, rows[0].g.T.max);
  const B = 10, bins = Array(B).fill(0);
  notes.forEach(v => bins[Math.min(B - 1, Math.max(0, Math.floor(v / top * B)))]++);
  const bmax = Math.max(...bins);
  const hist = `<svg viewBox="0 0 400 190" role="img" aria-label="Distribución de notas" style="width:100%;height:auto">
    ${bins.map((c, i) => { const h = bmax ? c / bmax * 140 : 0, x = 10 + i * 38, lo = top * i / B; const ok = ex.scale > 0 ? lo + top / B / 2 >= ex.pass : true;
      return `<rect x="${x}" y="${155 - h}" width="32" height="${h}" rx="3" fill="${ok ? 'var(--ok)' : 'var(--bad)'}" opacity=".85"/>${c ? `<text x="${x + 16}" y="${150 - h}" font-size="12" text-anchor="middle" fill="currentColor">${c}</text>` : ''}<text x="${x + 16}" y="172" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">${fmt(lo)}</text>`; }).join('')}
    <line x1="6" y1="155" x2="394" y2="155" stroke="currentColor" opacity=".3"/></svg>`;
  // análisis por pregunta
  const sorted = rows.slice().sort((a, b) => b.g.T.score - a.g.T.score);
  const kk = Math.max(1, Math.round(n * 0.27)), hi = sorted.slice(0, kk), lo = sorted.slice(-kk);
  const items = Array.from({ length: ex.nQ }, (_, i) => {
    const st = rows.map(x => x.g.per[i]);
    const keyed = st[0].st !== 'nokey';
    const p = st.filter(z => z.st === 'ok' || z.st === 'bonus').length / n;
    const okIn = arr => arr.filter(x => ['ok', 'bonus'].includes(x.g.per[i].st)).length / arr.length;
    const dist = {}; LET.forEach(l => dist[l] = 0); dist.blank = 0; dist.multi = 0;
    rows.forEach(x => { const a = x.r.answers[i] || ''; if (!a) dist.blank++; else if (a.length > 1) dist.multi++; else dist[a]++; });
    return { i, keyed, p, D: n >= 4 ? okIn(hi) - okIn(lo) : null, dist, key: ex.key[i], sec: secOf(ex, i + 1) };
  });
  const sel = S.item != null && items[S.item] ? items[S.item] : null;
  const hardest = items.filter(t => t.keyed && t.key !== '*').sort((a, b) => a.p - b.p).slice(0, 5);
  return `<div class="kpis">
      <div class="kpi"><b>${n}</b><span>hojas evaluadas</span></div>
      <div class="kpi"><b>${fmt(avg)}</b><span>promedio ${scaleLabel(ex)}</span></div>
      <div class="kpi"><b>${pct(effT)}</b><span>eficiencia total</span></div>
      <div class="kpi"><b>${fmt(Math.max(...notes))}</b><span>nota más alta</span></div>
      <div class="kpi"><b>${fmt(Math.min(...notes))}</b><span>nota más baja</span></div>
      ${ex.scale > 0 ? `<div class="kpi"><b>${nPass}</b><span>aprobados (${pct(nPass / n)})</span></div>` : ''}
      <div class="kpi"><b>${fmt(sd)}</b><span>desviación estándar</span></div>
    </div>
    <div class="two">
      <div class="panel"><h3>Eficiencia por curso</h3><p class="muted small">Porcentaje de respuestas correctas del curso, sumando a todos los alumnos.</p>
        <div class="bars">${secs.map(x => `<div class="bar-row"><span class="lbl" title="${esc(x.s.name)}"><span class="swatch" style="background:${x.s.color};width:10px;height:10px"></span> ${esc(x.s.name)}</span>
          <span class="track"><i style="width:${x.eff * 100}%;background:${x.s.color}"></i></span><span class="val">${pct(x.eff)}</span>
          <span class="sub">Nota promedio ${fmt(x.note)} ${scaleLabel(ex)} · ${fmt(x.score)} de ${fmt(x.max)} pts · ${x.n} preguntas</span></div>`).join('')}</div></div>
      <div class="panel"><h3>Distribución de notas</h3><p class="muted small">${ex.scale > 0 ? `En verde, los tramos desde la nota aprobatoria (${ex.pass}).` : 'Puntaje directo.'}</p>${hist}
        ${hardest.length ? `<p class="small" style="margin-bottom:0"><b>Preguntas más difíciles:</b> ${hardest.map(t => `${t.i + 1} (${pct(t.p)})`).join(', ')}</p>` : ''}</div>
    </div>
    <div class="panel"><h3>Mapa de la cartilla</h3><p class="muted small">Cada círculo es una pregunta, coloreada por el porcentaje de alumnos que acertó. Tócalo para ver qué marcaron.</p>
      <div class="heat">${items.map(t => `<button class="hq ${t.keyed ? '' : 'nokey'}" style="background:${t.keyed ? heat(t.p) : ''};outline:2px solid ${t.sec.color};outline-offset:-2px" data-act="item" data-i="${t.i}" aria-pressed="${S.item === t.i}" aria-label="Pregunta ${t.i + 1}">${t.i + 1}<small>${t.keyed ? pct(t.p) : 'sin clave'}</small></button>`).join('')}</div>
      <div class="legend"><span>0%</span><span class="grad"></span><span>100% de aciertos</span><span style="margin-left:12px">El borde indica el curso.</span></div>
      ${sel ? itemPanel(sel, n) : ''}
    </div>`;
}
function itemPanel(t, n) {
  const opts = [...LET.map(l => [l, l]), ['blank', 'En blanco'], ['multi', 'Doble marca']];
  return `<div class="panel" style="margin:18px 0 0;background:var(--sunk)"><div class="row" style="justify-content:space-between"><h3>Pregunta ${t.i + 1} · ${esc(t.sec.name)}</h3>
    <span class="small">Clave: <b>${t.key === '*' ? 'anulada' : t.key || 'sin clave'}</b> · Aciertos: <b>${pct(t.p)}</b>${t.D != null ? ` · Discriminación: <b>${t.D.toFixed(2)}</b>` : ''}</span></div>
    ${opts.map(([k, l]) => { const c = t.dist[k], isK = k === t.key; return `<div class="dist"><b style="${isK ? 'color:var(--ok)' : ''}">${l}${isK ? ' ✓' : ''}</b><span class="track"><i style="width:${c / n * 100}%;background:${isK ? 'var(--ok)' : (k === 'blank' || k === 'multi') ? 'var(--blank)' : 'var(--bad)'}"></i></span><span class="small">${c} (${pct(c / n)})</span></div>`; }).join('')}
    ${t.D != null ? `<p class="muted small" style="margin-bottom:0">Discriminación = aciertos del 27% con mejor puntaje menos los del 27% con peor puntaje. Sobre 0.3 la pregunta separa bien; negativa sugiere revisar la clave.</p>` : ''}</div>`;
}

/* ===== Detalle de una hoja (como la revisión de ZipGrade) ===== */
function overlaySVG(ex, g, res) {
  const L = layoutOf(ex), R = L.r + 3.5, o = [`<svg viewBox="0 0 ${L.W} ${L.H}" aria-hidden="true">`];
  const doubts = new Set(res.doubts || []);
  L.q.forEach((q, i) => {
    const p = g.per[i]; if (!p) return;
    const col = (p.st === 'ok' || p.st === 'bonus') ? '#1FA95A' : p.st === 'nokey' ? '#8A939B' : '#E0392B';
    (p.a || '').split('').forEach(l => { const b = q.b[LET.indexOf(l)]; if (b) o.push(`<circle cx="${b.x}" cy="${b.y}" r="${R}" fill="none" stroke="${col}" stroke-width="3.5"/>`); });
    if (p.k && p.k !== '*' && p.st !== 'ok') { const b = q.b[LET.indexOf(p.k)]; if (b) o.push(`<circle cx="${b.x}" cy="${b.y}" r="${R}" fill="none" stroke="#1FA95A" stroke-width="3" stroke-dasharray="4 3"/>`); }
    if (doubts.has(i)) o.push(`<rect x="${q.labelX - L.p * 1.05}" y="${q.y - L.p * 0.46}" width="${q.b[4].x + L.r + 6 - (q.labelX - L.p * 1.05)}" height="${L.p * 0.92}" rx="6" fill="#F2BE2C" fill-opacity=".22" stroke="#D69E00" stroke-width="2"/>`);
    if (p.st !== 'nokey') o.push(`<text x="${q.labelX - L.p * 0.95}" y="${q.y + 6}" font-size="${Math.round(L.p * 0.45)}" font-weight="700" fill="${col}" font-family="Arial">${p.st === 'ok' || p.st === 'bonus' ? 'c' : p.st === 'blank' ? '–' : 'x'}</text>`);
  });
  if (L.idDigits > 0 && res.studentId) {
    L.id.forEach(pt => { if (String(res.studentId)[pt.d] === String(pt.v)) o.push(`<circle cx="${pt.x}" cy="${pt.y}" r="${R}" fill="none" stroke="#2F6FDE" stroke-width="3.5"/>`); });
  }
  o.push('</svg>');
  return o.join('');
}
function detailView() {
  const r = S.results[S.detail], ex = S.exams[r.examId], g = grade(ex, r.answers);
  const list = examResults(ex), idx = list.findIndex(x => x.id === r.id);
  const dz = new Set(r.doubts || []);
  const qrows = g.per.map((p, i) => `<tr ${dz.has(i) ? 'class="doubt"' : ''}><td><b>${i + 1}</b>${dz.has(i) ? ' <span class="st warn">revisar</span>' : ''}</td><td>${LET.map(l => `<button class="mb ${(p.a || '').includes(l) ? 'on' : ''} ${p.k === l ? 'key' : ''}" data-act="edit" data-i="${i}" data-l="${l}" aria-label="Pregunta ${i + 1} marcar ${l}">${l}</button>`).join(' ')}</td>
    <td><span class="st ${p.st}">${{ ok: 'Correcta', bad: 'Incorrecta', blank: 'En blanco', multi: 'Doble marca', nokey: 'Sin clave', bonus: 'Anulada' }[p.st]}</span></td><td class="small">${p.st === 'nokey' ? '' : fmt(p.sc)}</td></tr>`).join('');
  return `<div class="modal" data-act="closebg"><div class="modal-card" role="dialog" aria-modal="true" aria-label="Revisión de la hoja">
    <div class="modal-head">
      <button class="btn sm" data-act="nav" data-d="-1" ${idx <= 0 ? 'disabled' : ''} aria-label="Hoja anterior">‹</button>
      <button class="btn sm" data-act="nav" data-d="1" ${idx >= list.length - 1 ? 'disabled' : ''} aria-label="Hoja siguiente">›</button>
      <div class="grow"><input type="text" id="detName" value="${esc(r.name)}" placeholder="Nombre del alumno" aria-label="Nombre del alumno"><input type="text" id="detId" value="${esc(r.studentId)}" placeholder="Código" aria-label="Código"></div>
      <button class="btn sm" data-act="close" aria-label="Cerrar">✕</button>
    </div>
    ${(dz.size || r.idDoubt) ? `<div class="note small">${dz.size ? `Revisa ${dz.size === 1 ? 'la pregunta' : 'las preguntas'} ${[...dz].map(i => i + 1).join(', ')} (resaltadas en amarillo): la marca es tenue, hay un borrón o dos círculos parecidos. ` : ''}${r.idDoubt ? 'Verifica el código del alumno. ' : ''}Toca una alternativa en "Preguntas" para corregir. <button class="btn sm" data-act="okdoubt">Ya lo revisé</button></div>` : ''}
    <div class="det">
      <div>
        <div class="seg" style="margin-bottom:10px"><button data-act="dview" data-v="img" aria-pressed="${S.detView === 'img'}">Imagen</button><button data-act="dview" data-v="q" aria-pressed="${S.detView === 'q'}">Preguntas</button></div>
        ${S.detView === 'img' ? (r.img ? `<div class="rev"><img src="${r.img}" alt="Hoja corregida">${overlaySVG(ex, g, r)}</div>` : `<p class="muted">La imagen no se guardó en este navegador. Revisa por preguntas.</p>`)
      : `<p class="muted small">Toca una alternativa para corregir la lectura. El borde verde indica la clave.</p><div class="scroll-x"><table class="qlist">${qrows}</table></div>`}
      </div>
      <div>
        <div class="big-note ${passes(ex, g.T.note) ? 'pass' : 'fail'}">${fmt(g.T.note)}<small> ${scaleLabel(ex)}</small></div>
        <p style="margin:6px 0 0">${fmt(g.T.score)} de ${fmt(g.T.max)} puntos · eficiencia <b>${pct(g.T.eff)}</b></p>
        <p class="muted small" style="margin:2px 0 14px">${g.T.c} correctas, ${g.T.w} incorrectas, ${g.T.b} en blanco · puesto ${rowsFor(ex).sort((a, b) => b.g.T.score - a.g.T.score).findIndex(x => x.r.id === r.id) + 1} de ${list.length}</p>
        <h3>Por curso</h3>
        <div class="bars">${g.secs.map(s => `<div class="bar-row"><span class="lbl" title="${esc(s.sec.name)}">${esc(s.sec.name)}</span><span class="track"><i style="width:${s.eff * 100}%;background:${s.sec.color}"></i></span><span class="val">${fmt(s.note)}</span><span class="sub">${s.c}/${s.n} correctas (${pct(s.eff)}) · ${fmt(s.score)} de ${fmt(s.max)} pts</span></div>`).join('')}</div>
        <div class="row" style="margin-top:18px"><button class="btn danger sm" data-act="delres">Eliminar hoja</button></div>
      </div>
    </div></div></div>`;
}

/* ===== Exportar ===== */
function tableData(ex) {
  const rows = rowsFor(ex).sort((a, b) => b.g.T.score - a.g.T.score);
  const secs = rows.length ? rows[0].g.secs : [];
  const head = ['Puesto', 'Código', 'Alumno', 'Nota', 'Puntaje', 'Máximo', 'Eficiencia %', 'Correctas', 'Incorrectas', 'En blanco', ...secs.flatMap(s => [s.sec.name + ' nota', s.sec.name + ' eficiencia %']), ...Array.from({ length: ex.nQ }, (_, i) => 'P' + (i + 1))];
  const body = rows.map((x, i) => [i + 1, x.r.studentId, x.r.name, fmt(x.g.T.note), fmt(x.g.T.score), fmt(x.g.T.max), Math.round(x.g.T.eff * 100), x.g.T.c, x.g.T.w, x.g.T.b,
    ...x.g.secs.flatMap(s => [fmt(s.note), Math.round(s.eff * 100)]), ...Array.from({ length: ex.nQ }, (_, j) => x.r.answers[j] || '')]);
  return [head, ...body];
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* ===== Eventos ===== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, ex = curExam();
  if (act === 'closebg' && e.target !== el) return;
  switch (act) {
    case 'home': Cam.stop(); S.cur = null; S.detail = null; render(); break;
    case 'new': { const n = newExam(false); S.cur = n.id; S.tab = 'config'; render(); break; }
    case 'example': { const n = newExam(true); S.cur = n.id; S.tab = 'config'; render(); toast('Ejemplo creado con clave al azar. Prueba "Escanear" → hoja simulada.'); break; }
    case 'open': S.cur = el.dataset.id; S.tab = 'config'; S.log = []; S.item = null; render(); break;
    case 'tab': S.camResult = null; if (el.dataset.tab !== 'scan') Cam.stop(); S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'addsec': {
      const used = ex.sections.reduce((m, s) => Math.max(m, +s.to || 0), 0);
      const from = Math.min(ex.nQ, used + 1), to = Math.min(ex.nQ, from + 4);
      ex.sections.push({ id: uid(), name: 'Curso ' + (ex.sections.length + 1), from, to, pts: 1, wrong: 0, blank: 0, color: COLORS[ex.sections.length % COLORS.length] });
      Store.put('exam', ex); render(); break;
    }
    case 'delsec': ex.sections.splice(+el.dataset.i, 1); Store.put('exam', ex); render(); break;
    case 'split': {
      const k = Math.max(1, Math.min(20, +$('#splitN').value || 1)), size = Math.ceil(ex.nQ / k);
      const old = ex.sections;
      ex.sections = Array.from({ length: k }, (_, i) => ({ id: old[i]?.id || uid(), name: old[i]?.name || 'Curso ' + (i + 1), from: i * size + 1, to: Math.min(ex.nQ, (i + 1) * size), pts: old[i]?.pts ?? 1, wrong: old[i]?.wrong ?? 0, blank: old[i]?.blank ?? 0, color: old[i]?.color || COLORS[i % COLORS.length] })).filter(s => s.from <= ex.nQ);
      Store.put('exam', ex); render(); break;
    }
    case 'key': { const i = +el.dataset.i, l = el.dataset.l; ex.key[i] = ex.key[i] === l ? '' : l; Store.put('exam', ex); render(); break; }
    case 'paste': {
      const chars = ($('#pasteKey').value || '').toUpperCase().replace(/[^A-E*\-_]/g, '').split('');
      chars.slice(0, ex.nQ).forEach((c, i) => ex.key[i] = (c === '-' || c === '_') ? '' : c);
      Store.put('exam', ex); toast(`Clave aplicada a ${Math.min(chars.length, ex.nQ)} preguntas`); render(); break;
    }
    case 'clearkey': if (confirm('¿Borrar toda la clave?')) { ex.key = Array(ex.nQ).fill(''); Store.put('exam', ex); render(); } break;
    case 'delexam':
      if (confirm(`¿Eliminar "${ex.name}" y todas sus hojas escaneadas?`)) {
        examResults(ex).forEach(r => { delete S.results[r.id]; Store.del('res', r.id); });
        delete S.exams[ex.id]; Store.del('exam', ex.id); S.cur = null; render();
      } break;
    case 'print': {
      $('#printArea').innerHTML = pageSVG(ex, ex.perPage || 1).replace('width="1600" height="2262"', '');
      try { window.print(); } catch (err) { toast('La impresión directa no está disponible aquí. Usa "Descargar para imprimir".'); }
      break;
    }
    case 'png': {
      const im = await svgToImage(pageSVG(ex, ex.perPage || 1)); const c = document.createElement('canvas'); c.width = 2480; c.height = 3508;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => saveFile(`hoja-${slug(ex.name)}.png`, b), 'image/png'); break;
    }
    case 'htmlsheet': {
      const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Hoja de respuestas - ${esc(ex.name)}</title><style>@page{size:A4;margin:0}html,body{margin:0}svg{width:210mm;height:297mm;display:block}</style></head><body>${pageSVG(ex, ex.perPage || 1).replace('width="1600" height="2262"', '')}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
      saveFile(`hoja-${slug(ex.name)}.html`, html); break;
    }
    case 'mode': S.scanMode = el.dataset.m; render(); break;
    case 'camon': Cam.start(); break;
    case 'camoff': Cam.stop(); render(); break;
    case 'capture': S.camResult = null; Cam.capture(); break;
    case 'sim': simulate(); break;
    case 'crnext': S.camResult = null; Cam.waitLost = false; Cam.sameRead = 0; Cam.lastSig = null; render(); break;
    case 'cridx': S.camIdx = Math.max(0, (S.camIdx || 0) + +el.dataset.d); render(); break;
    case 'detail': S.detail = el.dataset.id; S.detView = 'img'; render(); break;
    case 'close': S.detail = null; render(); break;
    case 'closebg': S.detail = null; render(); break;
    case 'dview': S.detView = el.dataset.v; render(); break;
    case 'nav': { const r = S.results[S.detail], list = examResults(S.exams[r.examId]); const i = list.findIndex(x => x.id === r.id) + +el.dataset.d; if (list[i]) { S.detail = list[i].id; render(); } break; }
    case 'edit': {
      const r = S.results[S.detail], i = +el.dataset.i, l = el.dataset.l; const a = r.answers[i] || '';
      r.answers[i] = a.includes(l) ? a.replace(l, '') : LET.filter(x => (a + l).includes(x)).join('');
      r.edited = true; r.doubts = (r.doubts || []).filter(x => x !== i); Store.put('res', r); render(); break;
    }
    case 'okdoubt': { const r = S.results[S.detail]; r.doubts = []; r.idDoubt = false; Store.put('res', r); render(); break; }
    case 'delres': if (confirm('¿Eliminar esta hoja?')) { const id = S.detail; delete S.results[id]; Store.del('res', id); S.detail = null; render(); } break;
    case 'sort': { const k = el.dataset.k; S.sort = { k, d: S.sort.k === k ? -S.sort.d : (k === 'name' || k === 'id' ? 1 : -1) }; render(); break; }
    case 'item': S.item = S.item === +el.dataset.i ? null : +el.dataset.i; render(); break;
    case 'csv': { const t = tableData(ex); saveFile(`resultados-${slug(ex.name)}.csv`, '\ufeff' + t.map(r => r.map(csvCell).join(',')).join('\n')); break; }
    case 'copy': {
      const t = tableData(ex).map(r => r.join('\t')).join('\n');
      try { await navigator.clipboard.writeText(t); toast('Tabla copiada. Pégala en Excel.'); } catch (err) { toast('No se pudo copiar; usa "Descargar CSV".'); }
      break;
    }
    case 'view': S.view = S.view === 'movil' ? 'pc' : 'movil'; Prefs.set('view', S.view); applyPrefs(); render(); window.scrollTo(0, 0); toast(S.view === 'movil' ? 'Formato celular' : 'Formato PC'); break;
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; Prefs.set('theme', S.theme); applyPrefs(); render(); break;
    case 'backup': saveFile('respaldo-cartillas.json', JSON.stringify({ app: 'lector-cartillas', v: 1, exams: S.exams, results: S.results })); break;
  }
});
const slug = s => (s || 'evaluacion').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'evaluacion';

document.addEventListener('change', async e => {
  const t = e.target, ex = curExam();
  if (t.id === 'autoCap') { Cam.auto = t.checked; return; }
  if (t.id === 'sortSel') { const k = t.value; S.sort = { k, d: (k === 'name' || k === 'id') ? 1 : -1 }; render(); return; }
  if (t.id === 'perPage') { ex.perPage = +t.value; Store.put('exam', ex); render(); return; }
  if (t.id === 'autoThr') { ex.autoThr = t.checked; Store.put('exam', ex); render(); return; }
  if (t.id === 'camFile' || t.id === 'galFile') { const f = [...t.files]; t.value = ''; await processFiles(f); return; }
  if (t.id === 'impFile') {
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      Object.values(j.exams || {}).forEach(x => { S.exams[x.id] = x; Store.put('exam', x); });
      Object.values(j.results || {}).forEach(x => { S.results[x.id] = x; Store.put('res', x); });
      toast('Respaldo importado'); render();
    } catch (err) { toast('Ese archivo no es un respaldo válido.'); }
    return;
  }
  if (!ex) return;
  if (t.dataset.ex) {
    const f = t.dataset.ex; let v = t.value;
    if (['nQ', 'idDigits', 'scale', 'pass', 'thr', 'sens'].includes(f)) v = +v;
    if (f === 'nQ') { v = Math.max(1, Math.min(100, Math.round(v) || 1)); ex.key = Array.from({ length: v }, (_, i) => ex.key[i] || ''); }
    if (f === 'idDigits') v = Math.max(0, Math.min(10, Math.round(v) || 0));
    ex[f] = v; Store.put('exam', ex); render(); return;
  }
  if (t.dataset.sec !== undefined) {
    const s = ex.sections[+t.dataset.sec], f = t.dataset.f;
    s[f] = ['from', 'to', 'pts', 'wrong', 'blank'].includes(f) ? (t.value === '' ? 0 : +t.value) : t.value;
    Store.put('exam', ex); render(); return;
  }
  if (t.dataset.ov !== undefined) {
    const i = +t.dataset.ov; if (t.value === '') delete ex.ptsOv[i]; else ex.ptsOv[i] = +t.value;
    Store.put('exam', ex); render(); return;
  }
  if (t.id === 'detName' || t.id === 'detId') {
    const r = S.results[S.detail]; if (!r) return;
    if (t.id === 'detName') r.name = t.value; else { r.idDoubt = false; r.studentId = t.value.trim(); if (!r.name) r.name = rosterMap(S.exams[r.examId])[r.studentId] || ''; }
    Store.put('res', r); render();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { S.q = t.value; const pos = t.selectionStart; render(); const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  if (t.id === 'exThr') $('#thrV').textContent = Math.round(t.value * 100) + '%';
  if (t.id === 'exSens') $('#sensV').textContent = Math.round(t.value * 100);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.detail) { S.detail = null; render(); } });

/* ===== Inicio ===== */
S.view = Prefs.get('view', matchMedia('(max-width: 760px)').matches ? 'movil' : 'pc');
S.theme = Prefs.get('theme', '');
applyPrefs();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) { applyPrefs(); render(); } });
Store.loadLocal();
render();
Store.connect();
dl();
</script></body></html>
